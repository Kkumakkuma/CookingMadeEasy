title: CookingMadeEasy
description: "Simple recipes, smart meal prep, and kitchen tips to make everyday cooking effortless and delicious."
url: "https://kkumakkuma.github.io"
baseurl: "/CookingMadeEasy"
permalink: /:year/:month/:day/:title/
future: true

theme: minima

author:
  name: CookingMadeEasy
  email: ""

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true

google_analytics: "G-5L40K3SBQT"

exclude:
  - scripts/
  - .github/
  - README.md
  - Gemfile
  - Gemfile.lock
